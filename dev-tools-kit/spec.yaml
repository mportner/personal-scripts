#
# dev-tools: an sbx mixin kit that puts the toolchain Mike's projects expect
# into a sandbox before the agent starts, so the agent never has to install
# its own tooling.
#
# The stock claude-code-docker image ships Node 22 from Ubuntu universe, no
# pnpm, and gh 2.46. Every project here wants Node 24 and a pnpm pinned by
# packageManager, so each session opened with the agent discovering that,
# failing to run `corepack enable` (it cannot write /usr/bin), and hand-rolling
# a pnpm shim in its scratch directory. Measured on a real session: 27 of 89
# bash calls went to toolchain wrangling before any work started.
#
# Node and pnpm come from mise, which resolves each project's pinned version
# from its own package.json. See the install step for why that matters beyond
# convenience.
#
# Stacks with claude-config rather than replacing it:
#   sbx create claude \
#     --kit ~/personal-scripts/claude-config-kit \
#     --kit ~/personal-scripts/dev-tools-kit .
#
# It also carries the host's supply-chain policy in, which the sandbox
# otherwise lacks: minimumReleaseAge, minimumReleaseAgeStrict and
# blockExoticSubdeps applied globally rather than only inside repositories that
# commit them. Every direct download is a pinned version checked against the
# publisher's own checksum manifest; the supporting packages come from apt,
# signed by the distro and versioned by it rather than pinned here.
#
# Nothing here runs through npm or npx, and that is now true rather than
# aspirational. It was not before: `packageManager` made pnpm fetch a second,
# unpinned pnpm from the npm registry and re-execute it. mise installing the
# pinned version is what stops that, because self-management does not trigger
# when the running pnpm already matches the pin.
#
# Roughly 30s at sandbox creation, most of it the Playwright system libraries;
# about 15s with SBX_DEV_TOOLS_PLAYWRIGHT=0 (see below) to skip those. Measured
# range across runs is 30 to 40s, the variance coming from the apt mirror.
schemaVersion: "2"
kind: mixin
name: dev-tools
version: "0.1.0"
displayName: Dev Toolchain
description: Installs mise with Node and pnpm, current gh, and project tooling.

# Deliberately beside the kit that installs `gh`, rather than in research-kit
# where these two sections used to live. They describe how the agent should use
# `gh` against a narrow token, and this kit is loaded in both the research and
# the development stacks while research-kit is loaded in only one. A
# development sandbox needs them just as much, and keeping them next to the
# tool they are about is what stops the pair drifting apart again.
#
# For a mixin this is written to kits-agent-context/<kit-name>.md and read on
# demand, so length is not charged against the context budget at rest.
agentInstructions:
  content: |
    # GitHub from a sandbox

    ## Access is deliberately narrow

    The token here is scoped to specific repositories and cannot reach the rest
    of the user's account. The default branch is protected by a ruleset that
    requires a pull request, so pushing to it directly will be refused. That is
    expected, not a misconfiguration to work around. Use a feature branch and
    open a PR.

    ## `gh pr checks` does not work here, but CI is still readable

    The token is a fine-grained one, and reading check runs needs the `checks`
    permission, which exists only for GitHub Apps. So `gh pr checks` fails with
    `Resource not accessible by personal access token` no matter how the token
    is configured. This is a ceiling, not a misconfiguration, and not something
    to ask the user to fix.

    Read CI through the Actions API instead:

    ```bash
    gh api "repos/OWNER/REPO/actions/runs?head_sha=$SHA" \
      --jq '.workflow_runs[] | "\(.name): \(.status)/\(.conclusion)"'
    ```

    Poll that until every run reports a `conclusion`. Do not fall back to
    reporting local test results as though they were CI, and do not describe a
    branch as green on the strength of a local run. If you genuinely cannot
    read CI, say so plainly in those words.

# One sized volume holding everything pnpm generates. The workspace is a
# virtiofs mount of the host checkout, so anything pnpm writes under it is
# written into a macOS tree by a Linux install: the darwin binaries are
# unrunnable here, hardlinking across the mount boundary silently degrades to
# full copies, and installs failed outright with ENOENT on directories whose
# parents existed.
#
# The previous answer was to bind-mount a private directory over every
# node_modules at container start. That needed root, needed a second copy of
# the same logic in project-sandbox for worktrees, and could not cover a
# worktree created after the container started, which is the case that broke.
#
# `size` is what makes this possible and is why the volume was rejected before:
# a comment here used to record that volumes[].path takes no size and sbx gives
# one 488M. Spec v2 defines the field and sbx 0.39.0 honours it; a kit
# declaring 10g gets a 9.8G ext4 filesystem. Volumes survive stop/start and are
# dropped by `sbx rm`, same as the container.
volumes:
  - path: /var/lib/pnpm
    size: 10g
    # Mounts root-owned regardless, so a startup command chowns it. Left at the
    # normal directory mode rather than 1777: nothing here is multi-user.
    mode: "0755"

environment:
  variables:
    # pnpm derives its global bin directory as $PNPM_HOME/bin, so this points
    # one level above ~/.local/bin, which is already first on PATH. The default
    # (~/.local/share/pnpm) makes every `pnpm config`, `pnpm bin -g` and global
    # install print "the configured global bin directory is not in PATH" and
    # exit 1.
    PNPM_HOME: /home/agent/.local

    # Where the install step put Node and pnpm. Without this the agent's mise
    # looks in ~/.local/share/mise, finds nothing, and every shim reinstalls
    # the toolchain on first use. One shared directory, agent-owned so a
    # project pinning a version that is not baked in can still install it.
    MISE_DATA_DIR: /usr/local/share/mise

    # Deliberately no MISE_TRUSTED_CONFIG_PATHS, because nothing here needs a
    # project config to be trusted. An idiomatic version file is never subject
    # to the gate, so `packageManager` in a package.json resolves untrusted,
    # and a mise.toml is exempt while it holds only tools, tasks and
    # min_version. Verified: an untrusted mise.toml declaring just `[tools]`
    # resolves its pin.
    #
    # The exemption ends the moment a project adds `[env]`, and mise then
    # refuses the whole file rather than the offending section, `[tools]`
    # included. It says so loudly rather than silently. If a project here ever
    # grows an `[env]` block, this decision has to be revisited.

    # The content-addressable store, moved onto the volume above. Safe to share
    # across every project in the sandbox because it is addressed by content.
    #
    # The prefix matters: pnpm 11 reads `pnpm_config_*` / `PNPM_CONFIG_*`, and
    # the older `npm_config_*` spelling is silently ignored for this setting.
    # Verified against pnpm 11.24.0; `npm_config_store_dir` left the store at
    # its default and printed nothing to say so.
    PNPM_CONFIG_STORE_DIR: /var/lib/pnpm/store

    # Without this the virtual store stays at <project>/node_modules/.pnpm, on
    # the workspace mount, and the store above would then be on a different
    # filesystem from it: pnpm cannot hardlink across that boundary and copies
    # every package instead, which is both slow and what exhausted the disk on
    # an earlier attempt. `global` puts it in the store, so the two are on one
    # filesystem by construction.
    #
    # It also removes the reason to compute a per-project path. A virtual store
    # encodes one project's dependency graph, so a single shared path would be
    # wrong; `global` is pnpm's own supported answer to that, which is why this
    # needs neither a wrapper on PATH nor per-project configuration.
    #
    # What stays in the workspace is the symlink farm and pnpm's own metadata.
    # Measured on a one-dependency project: 9 entries under node_modules
    # against 291 files in the store.
    #
    # Requires pnpm 11.23 or newer, which introduced the setting. An older pnpm
    # ignores it silently and leaves the virtual store in the tree, which is
    # worse than leaving both in the tree: the store above is still redirected,
    # so the two end up on different filesystems and every package becomes a
    # full copy written into the host checkout.
    #
    # Both projects this kit serves pin an older pnpm today, so both are in
    # that state until their `packageManager` moves. Tracked downstream; it is
    # a one-line change in each of those repositories, not something this kit
    # can do, because the pin is what pnpm obeys.
    PNPM_CONFIG_VIRTUAL_STORE_TYPE: global

    # Nothing here should ever act on an npm self-update notice.
    NPM_CONFIG_UPDATE_NOTIFIER: "false"

setup:
  install:
    - user: "0"
      description: Install Node 24, pnpm, gh, and project tooling
      command: |
        set -eu

        # ---- pinned versions -------------------------------------------
        # Bump these by hand. Each is checksum-verified below against the
        # publisher's own manifest, so a bad pin fails loudly rather than
        # installing something unexpected.
        MISE_VERSION=v2026.8.14     # installs Node and pnpm; versions live in
                                    # files/home/.config/mise/config.toml.
                                    # Published 2026-08-26, so it has cleared the
                                    # 5-day release-age window this setup enforces
                                    # everywhere else. Check that before bumping:
                                    # mise cuts a release most days, and the newest
                                    # tag is routinely hours old. Neither this
                                    # download nor mise's own installs are subject
                                    # to the window, so it is enforced by hand here.
        GH_VERSION=2.98.0           # image ships 2.46, which predates several flags in use
        TRUFFLEHOG_VERSION=3.97.1   # league-service security:scan; its own script says
                                    # `brew install`, which cannot work on Linux
        # ----------------------------------------------------------------

        # Opt out of the slowest piece without editing this file:
        #   sbx create ... -e SBX_DEV_TOOLS_PLAYWRIGHT=0
        PLAYWRIGHT="${SBX_DEV_TOOLS_PLAYWRIGHT:-1}"

        export DEBIAN_FRONTEND=noninteractive
        export PATH="/usr/local/bin:$PATH"

        # mise names its release assets linux-arm64 / linux-x64, the same pair
        # as Node; gh and trufflehog use the Go spelling.
        case "$(dpkg --print-architecture)" in
          arm64) MISE_ARCH=arm64; GO_ARCH=arm64 ;;
          amd64) MISE_ARCH=x64;   GO_ARCH=amd64 ;;
          *) echo "dev-tools: unsupported architecture $(dpkg --print-architecture)" >&2; exit 1 ;;
        esac

        # Optional extras must not take sandbox creation down with them: a
        # transient 502 from a release host is not a reason to have no sandbox.
        # The core toolchain below is the opposite, and is left under set -e.
        soft() {
          "$@" || echo "dev-tools: optional step failed: $*" >&2
        }

        # The optional installers below stay as `sh -c` blocks rather than
        # becoming shell functions. set -e is suppressed for a command on the
        # left of ||, and that suppression reaches into a function body: a
        # `soft install_gh` whose first curl failed would carry on to the
        # install step and put a truncated binary on PATH. It does not reach
        # into a separate shell process, so `sh -c` with its own set -eu is
        # what makes each block abort at the first failure and report once.

        # --- required system packages -----------------------------------
        # libatomic1 is not in the base image and the standalone pnpm binary
        # links against it, so without this pnpm dies at exec time with
        # "error while loading shared libraries: libatomic.so.1". Not optional
        # and deliberately not wrapped in soft(): a sandbox whose pnpm cannot
        # start should fail loudly at creation, not at first use.
        #
        # This was masked during development because the Playwright libraries
        # below pull libatomic1 in transitively; it only surfaced when testing
        # SBX_DEV_TOOLS_PLAYWRIGHT=0. Keep it here rather than relying on that.
        apt-get update -qq
        apt-get install -y --no-install-recommends libatomic1

        # --- small CLI gaps in the base image ---------------------------
        # file(1) is not there at all, which the agent hit mid-session; xz-utils
        # is needed for any .tar.xz, and unzip is called by a project test script.
        # Convenience only, so a failure here is survivable.
        soft apt-get install -y --no-install-recommends \
          xz-utils wget file tree unzip shellcheck

        # --- a C toolchain for native modules ---------------------------
        # The image has make and python3 but no compiler at all, so anything
        # node-gyp has to build from source dies at `make: cc: No such file or
        # directory`. A project this kit serves hits this through sqlite3,
        # which publishes no prebuilt for this platform and which its
        # pnpm-workspace.yaml explicitly allows to build; the symptom is 14
        # tests failing with
        # `Could not locate the bindings file ... node_sqlite3.node`, several
        # hundred tests into a run, which reads like a broken install rather
        # than a missing toolchain.
        #
        # The narrow set rather than build-essential, which additionally pulls
        # dpkg-dev for Debian packaging that node-gyp never calls. make and
        # coreutils are already here. python3-dev and pkg-config are in because
        # most other node-gyp packages want them, and discovering that one
        # module at a time is the failure this is meant to end.
        #
        # soft() like gh and trufflehog: a missing compiler should degrade the
        # sandbox, not prevent it existing. That is the opposite of libatomic1
        # above, which pnpm itself needs to start.
        soft apt-get install -y --no-install-recommends \
          gcc g++ libc6-dev python3-dev pkg-config

        # Proved rather than assumed, because soft() means the install above can
        # fail quietly and a compiler that is absent, or present and broken,
        # looks identical until a native module tries to build. Every other
        # check in this file fails at creation rather than at first use, and
        # this one costs milliseconds. CC_OK is reported in the closing summary.
        CC_OK=no
        cc_dir="$(mktemp -d)"
        printf 'int main(void){return 0;}\n' > "$cc_dir/t.c"
        if cc -o "$cc_dir/t" "$cc_dir/t.c" 2>/dev/null && "$cc_dir/t"; then
          CC_OK=yes
        fi
        rm -rf "$cc_dir"

        # --- mise, and Node and pnpm through it -------------------------
        # Node and pnpm used to be installed here by hand: a nodejs.org tarball
        # unpacked over /usr/local, and the pnpm standalone release with its
        # sha256 pinned inline because pnpm publishes no manifest beside it.
        # Both are now mise's job, for one reason that is not tidiness.
        #
        # A project pins pnpm through `packageManager`, and pnpm 11 self-manages:
        # if the running pnpm is not that exact version it fetches one from the
        # npm registry as `@pnpm/exe` and re-executes it. That package ships a 34
        # byte placeholder in place of its binary and relies on a `preinstall`
        # script to hardlink the real one over it, so when the step does not run
        # every pnpm invocation in the project dies with
        # `pnpm: 1: This: not found`. It is also a binary this kit never pinned
        # or verified, which made the header's "nothing runs through npm" claim
        # untrue in practice.
        #
        # There is no switch to turn self-management off; pnpm 11 removed it. But
        # it does not trigger at all when the running version already matches the
        # pin. Verified with pnpm 11.24.0 against a project pinning 11.24.0: no
        # `@pnpm/exe` appears in the store. So mise reading `packageManager` and
        # installing exactly that version does not work around the placeholder,
        # it means the package is never fetched.
        #
        # mise resolves both tools with checksum verification of its own:
        # `core:node` against nodejs.org's SHASUMS256.txt, and `aqua:pnpm/pnpm`
        # against aqua's registry. Neither goes through npm.
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        mise_file="mise-${MISE_VERSION}-linux-${MISE_ARCH}.tar.gz"
        curl -fsSL -o "$tmp/$mise_file" \
          "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/${mise_file}"
        curl -fsSL -o "$tmp/SHASUMS256.txt" \
          "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/SHASUMS256.txt"

        # Exact filename compare rather than a grep pattern, for the reason the
        # Node install used to give here: a version string is full of dots and a
        # dot is a regex wildcard, so a pattern built for one release also
        # matches a row for another, and the manifest lists several artifacts.
        # mise writes its names with a leading ./, which is stripped first. An
        # absent name leaves mise_sum empty and aborts.
        mise_sum=""
        while read -r h n; do
          n="${n#./}"
          if [ "$n" = "$mise_file" ]; then mise_sum="$h"; break; fi
        done < "$tmp/SHASUMS256.txt"
        [ -n "$mise_sum" ] || { echo "dev-tools: $mise_file absent from SHASUMS256.txt" >&2; exit 1; }
        printf '%s  %s\n' "$mise_sum" "$tmp/$mise_file" | sha256sum -c - >/dev/null

        tar -xzf "$tmp/$mise_file" -C "$tmp"
        install -m 755 "$tmp/mise/bin/mise" /usr/local/bin/mise
        /usr/local/bin/mise --version >/dev/null

        # One shared tool directory rather than the agent's home, so the install
        # below runs once at creation instead of on the agent's first command.
        # Agent-owned because a project pinning a version that is not here has
        # to be able to install it: mise does that on demand, as the agent.
        install -d -o agent -g agent -m 755 /usr/local/share/mise
        install -d -o agent -g agent -m 755 /home/agent/.config /home/agent/.config/mise

        # ~/.config/mise/config.toml ships as a static file and holds the
        # baseline versions. Run as the agent, not root: everything mise writes
        # here belongs to the user who will run the tools, and the config that
        # names the versions is in the agent's home, not root's.
        su -s /bin/sh agent -c '
          set -eu
          export MISE_DATA_DIR=/usr/local/share/mise
          mise install
          mise reshim
        '

        # Symlinks rather than putting the shim directory on PATH, which a kit
        # cannot do without rewriting PATH wholesale. Each shim resolves the
        # version from the directory it is invoked in, so `pnpm` in a project
        # pinning 11.7.0 is 11.7.0 and the same binary elsewhere is the
        # baseline.
        for t in node npm npx pnpm pnpx; do
          if [ -e "/usr/local/share/mise/shims/$t" ]; then
            ln -sf "/usr/local/share/mise/shims/$t" "/usr/local/bin/$t"
          fi
        done

        # Exercised as the agent, and through the symlinks just made, because
        # that is the only combination that proves anything. A shim asked for a
        # version by root fails with "No version is set for shim", since the
        # config naming the versions lives in the agent's home: verifying as
        # root would fail on a perfectly good install.
        #
        # Fails creation rather than handing back a sandbox whose toolchain is a
        # broken symlink or an empty shim directory.
        su -s /bin/sh agent -c '
          set -eu
          export MISE_DATA_DIR=/usr/local/share/mise
          node --version >/dev/null
          npm --version >/dev/null
          pnpm --version >/dev/null
        '

        # $PNPM_HOME/bin is where pnpm puts globally installed binaries, and it
        # errors out if that directory is not on PATH. Never run pnpm as root
        # from inside the workspace during install: it would create the store's
        # index.db root-owned and the agent could not write it afterwards.
        install -d -o agent -g agent -m 755 /home/agent/.local /home/agent/.local/bin \
          /home/agent/.cache/pnpm /home/agent/.local/state/pnpm

        # --- gh ---------------------------------------------------------
        soft sh -c "
          set -eu
          d=\$(mktemp -d); trap 'rm -rf \"\$d\"' EXIT
          base=https://github.com/cli/cli/releases/download/v${GH_VERSION}
          f=gh_${GH_VERSION}_linux_${GO_ARCH}.tar.gz
          curl -fsSL -o \"\$d/\$f\" \"\$base/\$f\"
          curl -fsSL -o \"\$d/sums\" \"\$base/gh_${GH_VERSION}_checksums.txt\"
          want=''
          while read -r h n; do
            if [ \"\$n\" = \"\$f\" ]; then want=\$h; break; fi
          done < \"\$d/sums\"
          [ -n \"\$want\" ] || exit 1
          printf '%s  %s\n' \"\$want\" \"\$d/\$f\" | sha256sum -c - >/dev/null
          tar -xzf \"\$d/\$f\" -C \"\$d\"
          install -m 755 \"\$d/gh_${GH_VERSION}_linux_${GO_ARCH}/bin/gh\" /usr/local/bin/gh
        "

        # --- trufflehog -------------------------------------------------
        soft sh -c "
          set -eu
          d=\$(mktemp -d); trap 'rm -rf \"\$d\"' EXIT
          base=https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}
          f=trufflehog_${TRUFFLEHOG_VERSION}_linux_${GO_ARCH}.tar.gz
          curl -fsSL -o \"\$d/\$f\" \"\$base/\$f\"
          curl -fsSL -o \"\$d/sums\" \"\$base/trufflehog_${TRUFFLEHOG_VERSION}_checksums.txt\"
          want=''
          while read -r h n; do
            if [ \"\$n\" = \"\$f\" ]; then want=\$h; break; fi
          done < \"\$d/sums\"
          [ -n \"\$want\" ] || exit 1
          printf '%s  %s\n' \"\$want\" \"\$d/\$f\" | sha256sum -c - >/dev/null
          tar -xzf \"\$d/\$f\" -C /usr/local/bin trufflehog
        "

        # --- Playwright system libraries --------------------------------
        # Playwright's own package list for ubuntu26.04, read out of
        # nativeDeps.ts at tag v1.62.1, which is what league-service pins.
        # Installed straight from apt rather than by running
        # `playwright install-deps`, because that means fetching the playwright
        # package first, and there is no way to do that at sandbox-creation
        # time under the same minimumReleaseAge policy that governs every other
        # install here. apt packages are signed by the distro, so this route
        # needs no such exception.
        #
        # Only the OS libraries. The browser itself stays a project concern:
        # league-service's playwright:install pulls the chromium shell through
        # its own pinned Playwright, and baking one in here would pin a second
        # version that disagrees with it.
        #
        # Re-derive the list when the pinned Playwright changes:
        #   curl -fsSL https://raw.githubusercontent.com/microsoft/playwright/v<VER>/packages/playwright-core/src/server/registry/nativeDeps.ts
        if [ "$PLAYWRIGHT" != "0" ]; then
          soft sh -c 'apt-get install -y --no-install-recommends \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 \
            xvfb fonts-noto-color-emoji fonts-unifont libfontconfig1 libfreetype6 \
            xfonts-cyrillic xfonts-scalable fonts-liberation fonts-ipafont-gothic \
            fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf'
        fi

        # ~/.npmrc and ~/.config/pnpm/config.yaml ship as static files, so they
        # are already in place. Both belong to the agent, not root.
        chown -R agent:agent /home/agent/.npmrc /home/agent/.config/pnpm 2>/dev/null || true

        # Closing summary, deliberately incapable of failing. gh and
        # trufflehog are optional, so a sandbox that did without one must not
        # then die printing a version banner for it, and node and pnpm were
        # already verified above where a failure is meant to abort.
        #
        # `gh --version | head -1` would in fact survive a missing gh on its
        # own, because without pipefail a pipeline reports the status of its
        # last command and head succeeds regardless. That is too subtle to rely
        # on: anyone adding `set -o pipefail` here would turn this block into a
        # failure path, which is exactly what soft() exists to prevent.
        su -s /bin/sh agent -c 'export MISE_DATA_DIR=/usr/local/share/mise; node --version' || true
        su -s /bin/sh agent -c 'export MISE_DATA_DIR=/usr/local/share/mise; pnpm --version' || true
        printf 'cc works: %s\n' "$CC_OK" || true
        gh --version 2>/dev/null | head -1 || true
        trufflehog --version 2>&1 | head -1 || true

  startup:
    - user: "0"
      description: Hand the pnpm volume to the agent
      command:
        - "sh"
        - "-c"
        - |
          # Must never exit non-zero: /etc/durable-startup.d/run.sh stops the
          # whole chain on the first failure, which would take out the other
          # kits' startup commands too. The trap is armed before anything
          # fallible runs. See claude-config-kit/spec.yaml for the same rule.
          trap 'exit 0' EXIT
          set -e

          # The volume declared above mounts root-owned whatever `mode` says,
          # so the agent cannot write to it until this runs.
          #
          # Guarded on the current owner rather than run unconditionally. This
          # re-runs on every container start, and `chown -R` costs one syscall
          # per file: harmless on the empty volume of a first start, and a walk
          # of the whole store by the time it holds a real install.
          #
          # This replaced a block that walked the workspace and bind-mounted a
          # private directory over every node_modules it found or expected.
          # That approach is gone: the volume plus PNPM_CONFIG_STORE_DIR and
          # PNPM_CONFIG_VIRTUAL_STORE_TYPE keep pnpm's output off the workspace
          # without mounting anything, so there is nothing left to fail
          # silently and nothing for a mid-session worktree to miss.
          # The recursive pass, for the first start after creation and for a
          # volume that was replaced between starts.
          if [ "$(stat -c %U /var/lib/pnpm)" != agent ]; then
            chown -R agent:agent /var/lib/pnpm
          fi

          # Then the store directory on its own, unconditionally. The guard
          # above reads only the volume root, so a store directory that is
          # missing under an already-owned root gets recreated by root here and
          # then skipped, leaving the agent unable to write its own store. This
          # is one chown rather than a walk, so it is cheap enough to run every
          # time and does not reintroduce what the guard exists to avoid.
          mkdir -p /var/lib/pnpm/store
          chown agent:agent /var/lib/pnpm/store
