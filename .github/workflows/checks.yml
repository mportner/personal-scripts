name: checks

on:
  push:
    branches: [main]
  # pull_request, NOT pull_request_target: a fork's PR must run with the fork's
  # code and none of this repo's write access. pull_request_target would hand a
  # writable token to code from the PR branch.
  pull_request:
  workflow_dispatch:

# Caps GITHUB_TOKEN for every job. This workflow only reads the checkout, so
# nothing below needs more than this.
permissions:
  contents: read

# A superseded push should not keep burning a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    # Nothing here should take more than a few seconds; the job default is 6
    # hours, which is a long time to spend on a hung apt mirror.
    timeout-minutes: 10
    steps:
      # Pinned to a commit, not a tag: v7 and v7.0.1 are mutable refs that a
      # compromised upstream can repoint at arbitrary code, which is exactly
      # how past Actions supply-chain attacks have been delivered. Re-pin
      # deliberately when upgrading; the trailing comment is the human-readable
      # version, not what resolves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default is true, which leaves the token in .git/config for every
          # later step to read. Nothing here pushes, so it is dead weight with
          # a blast radius.
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --version

      # setup.sh and uninstall.sh target bash 3.2 (what macOS ships), so they
      # are checked as bash rather than sh even though they avoid bash 4
      # features. shellcheck has no 3.2 dialect; the constraint is enforced by
      # the grep step below instead.
      #
      # lib/*.sh is sourced by bin/*.sh, never run standalone, so -x makes
      # shellcheck follow the `source` lines instead of just noting them, and
      # -P SCRIPTDIR resolves each `# shellcheck source=` comment relative to
      # the sourcing script's own directory rather than the current directory,
      # which is what makes bin/research-sandbox.sh's `source=../lib/...`
      # comments resolve correctly.
      - name: Check bash scripts
        run: shellcheck -x -s bash -P SCRIPTDIR setup.sh uninstall.sh bin/*.sh lib/*.sh

      - name: Check the status line (POSIX sh)
        run: shellcheck -s sh claude-config-kit/files/home/.claude/statusline.sh

      # The scripts the kit ships as files, run by the startup commands below.
      - name: Check the kit startup scripts (POSIX sh)
        run: shellcheck -s sh claude-config-kit/files/home/.claude-config-kit/*.sh

      # The kit's startup commands are shell embedded in YAML, so shellcheck
      # cannot reach them in place. Pull each one out and check it like any
      # other file.
      - name: Check the kit startup commands
        run: |
          # Distro package rather than pip: the runner's Python is
          # externally managed (PEP 668), so a plain `pip install` is refused.
          sudo apt-get install -y python3-yaml
          python3 - <<'PY'
          import yaml
          # Both kits, not just claude-config: dev-tools' startup command runs
          # under the same "must exit 0 or it takes the chain down" rule, so a
          # syntax error in it is equally invisible at runtime.
          for kit in ("claude-config-kit", "dev-tools-kit"):
              spec = yaml.safe_load(open(f"{kit}/spec.yaml"))
              for i, entry in enumerate(spec["setup"]["startup"]):
                  cmd = entry["command"]
                  assert cmd[:2] == ["sh", "-c"], f"unexpected startup form: {cmd[:2]}"
                  open(f"startup-extracted-{kit}-{i}.sh", "w").write(cmd[2])
          PY
          shellcheck -s sh startup-extracted-*.sh

      # -P test resolves the harness's own `# shellcheck source=` comments,
      # which are relative to test/ rather than to the checkout root.
      - name: Check the test harness
        run: shellcheck -x -s bash -P test test/*.sh

      # bash 3.2 has no mapfile/readarray and no associative arrays, and macOS
      # will not be getting a newer bash. Catching these here is cheaper than
      # finding out on a fresh machine.
      - name: Reject bash 4+ constructs
        run: |
          # ^[^#]* keeps the match on the code side of any comment: these very
          # scripts have a header comment saying "no mapfile", which a naive
          # pattern would flag as a violation of itself.
          # test/ is in the list because the harness runs on the same stock
          # macOS bash the scripts it tests target. A test that needs bash 4 to
          # run is a test that does not run where it matters most.
          if grep -nE '^[^#]*(\b(mapfile|readarray)\b|declare -A|local -A)' \
               setup.sh uninstall.sh bin/*.sh lib/*.sh test/*.sh; then
            echo "::error::bash 4+ construct found; these scripts target bash 3.2"
            exit 1
          fi
          echo "none found"

  # A job of its own rather than another step above: the two are independent and
  # fail differently. shellcheck is a lint over the whole tree; this reports
  # which test file broke. Separate jobs run in parallel and both report even
  # when one of them fails.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned for the same reason as the job above.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-latest ships jq, so this installs nothing. It is here to make the
      # dependency visible and to fail loudly if a future runner image drops it:
      # the credential and plan-name tests shell out to jq, and without it they
      # would exercise the "jq is not installed" path and pass while checking
      # nothing of what they are named for.
      - name: Check jq is available
        run: jq --version

      - name: Run the tests
        run: ./test/run.sh
