# Dependabot configuration for personal-scripts.
#
# Policy, matching the one used across the league-* repos:
#   - Weekly, grouped PRs for non-major minor/patch bumps: one github-actions
#     group, so a quiet week produces one PR rather than several.
#   - Major-version updates ARE proposed, which is a deliberate departure from
#     the league-* policy of ignoring them. There, majors are ignored because the
#     dependency tree is large and a major usually means real migration work. Here
#     the only dependency is the pinned actions/checkout, so ignoring majors would
#     mean nothing ever tells you v8 shipped, and the pin would quietly rot at v7
#     forever. The group below is scoped to minor and patch, so a major arrives as
#     its own separate PR rather than bundled with routine bumps.
#
#     If more dependencies are added later and the house ignore-majors policy is
#     wanted for those, list them by name in an `ignore:` block. Do not reintroduce
#     a `dependency-name: '*'` wildcard, which would silently re-cover checkout.
#   - cooldown.default-days: 7 keeps a release out of a PR until it has had a
#     week of community shake-out. This is the same argument bin/brew-upgrade-safe
#     makes for casks, applied to CI: being first to a bad release costs more
#     than being a week late to a good one.
#
# Only one ecosystem: this repo is shell scripts and YAML, with no package
# manifest, lockfile, or container image for Dependabot to read. The single
# workflow is what it tracks.
#
# Why this exists at all: .github/workflows/checks.yml pins actions/checkout to
# a commit SHA rather than a tag, because a tag is a mutable ref that a
# compromised upstream can repoint. A pin that nobody updates is how you end up
# on a two-year-old action, so Dependabot owns the refresh -- it rewrites both
# the SHA and the trailing "# vX.Y.Z" comment, which is exactly the maintenance
# the pin would otherwise need by hand. Both jobs in that workflow check out
# with the same pin, and Dependabot rewrites every occurrence, so adding a job
# costs nothing here.
#
# directory: / is the whole .github/workflows directory rather than a named file,
# so renaming or adding a workflow does not need a change here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch