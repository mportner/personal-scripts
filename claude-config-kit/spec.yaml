# claude-config: an sbx mixin kit that carries Mike's Claude Code setup
# (a custom three-line status line plus preferred settings) into every sandbox
# created with it.
#
# Four static files are copied to /home/agent at container creation:
#   files/home/.claude/statusline.sh              the status line script
#   files/home/.claude-config-kit/settings.json   settings to merge in
#   files/home/.claude-config-kit/trim-sandbox-guidance.sh
#   files/home/.claude-config-kit/stamp-subscription-type.sh
#
# The startup command below merges them into ~/.claude/settings.json, then
# installs whatever plugins that file enables. It jq-merges rather than
# replacing, because settings.json has concurrent writers: Claude Code itself
# writes "tui" mid-session, and the built-in claude kit owns defaultMode /
# bypassPermissionsModeAccepted / themeId there.
#
# The install step is separate on purpose: enabledPlugins only says which
# plugins should be active, it does not install them. See the comment on that
# block for why a settings-only kit gets flaky plugins.
#
# The two scripts run as startup commands of their own, repairing what the
# sandbox does to Claude Code's own inputs. Each carries its reasoning at the
# top of the file:
#
#   trim-sandbox-guidance.sh    strips the project guidance sbx invents in the
#                               CLAUDE.md it generates ABOVE the workspace,
#                               which Claude Code loads as project instructions
#   stamp-subscription-type.sh  records the plan in the OAuth credential file,
#                               whose sbx template omits it, so the banner stops
#                               calling a subscription session "Claude API"
#
# They are files rather than more inline shell because they are long enough to
# be worth testing, and test/ runs them directly against fixtures.
#
# Apply with:  sbx run claude --kit ~/personal-scripts/claude-config-kit
schemaVersion: "2"
kind: mixin
name: claude-config
version: "0.5.0"
displayName: Claude Code Config
description: Installs a custom status line, preferred settings, and the plugins they enable.

setup:
  startup:
    # Runs as agent, not root: settings.json lives in the agent's home and
    # root-owned files there would break Claude Code's own writes.
    - command:
        - "sh"
        - "-c"
        - |
          # This command must never exit non-zero. /etc/durable-startup.d/run.sh
          # aborts the whole startup chain on the first failure, which would take
          # out every later kit's commands too. The EXIT trap is set before
          # anything fallible runs and forces status 0 on every path, including
          # one set -e aborts on.
          #
          # The || true is not redundant: set -e applies inside trap handlers
          # too, so if the rm ever fails the handler aborts before reaching
          # `exit 0` and the real (non-zero) status escapes -- taking out the
          # rest of the dispatcher chain, which is exactly what this trap
          # exists to prevent.
          frag=""; out=""
          trap 'rm -f "$frag" "$out" 2>/dev/null || true; exit 0' EXIT
          set -e

          S="$HOME/.claude/statusline.sh"
          F="$HOME/.claude-config-kit/settings.json"
          C="$HOME/.claude/settings.json"

          mkdir -p "$HOME/.claude"
          [ -f "$C" ] || printf '{}' > "$C"

          # Temp files alongside the target so the final mv is a same-filesystem
          # rename: atomic, so a concurrent reader never sees a partial file.
          frag=$(mktemp "$C.frag.XXXXXX")
          out=$(mktemp "$C.out.XXXXXX")

          if [ -f "$F" ]; then
            cat "$F" > "$frag"
          else
            printf '{}' > "$frag"
            echo "claude-config: $F missing, merging status line only" >&2
          fi

          # Add the status line entry only when the script actually landed.
          # Pointing statusLine at a missing file would leave every session with
          # a broken bottom bar.
          if [ -f "$S" ]; then
            chmod +x "$S"
            if jq --arg c "$S" \
                 '.statusLine = {type: "command", command: $c, padding: 0}' \
                 "$frag" > "$out" 2>/dev/null; then
              cat "$out" > "$frag"
            else
              echo "claude-config: could not build status line entry" >&2
            fi
          else
            echo "claude-config: $S missing, skipping status line" >&2
          fi

          # Recursive merge, fragment wins on conflicts. Nested objects (env,
          # enabledPlugins) merge key-by-key rather than being replaced, so
          # anything the base claude kit put there survives.
          if jq -s '.[0] * .[1]' "$C" "$frag" > "$out" 2>/dev/null; then
            chmod 600 "$out"
            mv "$out" "$C"
          else
            echo "claude-config: settings.json unparseable, left untouched" >&2
          fi

          # Enabling a plugin is not the same as installing one. enabledPlugins
          # only records which plugins should be ACTIVE; the installed registry
          # is ~/.claude/plugins/installed_plugins.json, and nothing above
          # writes it. A sandbox that never runs `claude plugin install` starts
          # with an empty registry, so the plugins' hooks and skills load at
          # best inconsistently and can vanish mid-session.
          #
          # This has to run after the merge above, because it reads the
          # marketplaces and plugin list the merge just put in settings.json.
          #
          # Driven off the fragment rather than a second hardcoded list, so
          # enabling a plugin there is all that is ever needed to get it
          # installed here.
          #
          # Startup commands do not inherit a login shell's PATH, so claude is
          # not necessarily on it. The base claude kit exports exactly this
          # before calling `claude mcp add`; without it the check below finds
          # nothing and this whole section silently does nothing.
          export PATH="$HOME/.local/bin:$HOME/.claude/local:$PATH"

          command -v claude >/dev/null 2>&1 || exit 0
          installed=$(claude plugin list 2>/dev/null || true)
          for p in $(jq -r '.enabledPlugins // {} | keys[]' "$F" 2>/dev/null || true); do
            case "$installed" in
              *"$p"*) ;;
              *)
                if claude plugin install "$p" >/dev/null 2>&1; then
                  echo "claude-config: installed $p"
                else
                  echo "claude-config: could not install $p" >&2
                fi
                ;;
            esac
          done
      user: "agent"
      description: Merge settings and install the plugins they enable

    # Both scripts already exit 0 on every path, including the ones where they
    # decline to act. The `; exit 0` is the belt: /etc/durable-startup.d/run.sh
    # aborts the whole chain on the first non-zero status, taking out every
    # later kit's commands, and nothing either script does is worth that.
    #
    # Run as agent, like the merge above: both write files under the agent's
    # home or beside a workspace it owns, and a root-owned file in either place
    # would break Claude Code's own writes.
    - command:
        - "sh"
        - "-c"
        - 'sh "$HOME/.claude-config-kit/trim-sandbox-guidance.sh"; exit 0'
      user: "agent"
      description: Trim the project guidance sbx generates above the workspace

    - command:
        - "sh"
        - "-c"
        - 'sh "$HOME/.claude-config-kit/stamp-subscription-type.sh"; exit 0'
      user: "agent"
      description: Record the subscription plan in the staged credential file
